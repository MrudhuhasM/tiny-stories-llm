[project]
name = "story-llm"
version = "0.1.0"
description = " A small transformer-based language model trained on the TinyStories dataset, designed for generating short stories and narratives."
readme = "README.md"
authors = [
    { name = "MrudhuhasM", email = "mrudhuhas@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.5",
    "huggingface>=0.0.1",
    "tokenizers>=0.23.1",
    "wandb>=0.26.1",
    "pyyaml>=6.0",
    "tqdm>=4.67.3",
    "huggingface-hub>=0.27.0",
]

[project.scripts]
story-llm = "story_llm:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
